hostname ASA-OBJECTS
!
object network WEB_SERVER
 host 192.0.2.20
object network ADMIN_SUBNET
 subnet 198.51.100.0 255.255.255.0
object-group network TRUSTED_SOURCES
 network-object object ADMIN_SUBNET
object service HTTPS_SERVICE
 service tcp destination eq https
object-group service WEB_SERVICES tcp
 service-object object HTTPS_SERVICE
!
access-list ADMIN_TO_WEB extended permit object-group WEB_SERVICES object-group TRUSTED_SOURCES object WEB_SERVER log
access-list ADMIN_TO_WEB extended deny ip any any log
access-group ADMIN_TO_WEB in interface inside
