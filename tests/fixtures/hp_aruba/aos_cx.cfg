!Version ArubaOS-CX synthetic 10.13
hostname synthetic-aos-cx
access-list ip "EDGE"
    10 permit tcp 198.51.100.0/24 203.0.113.10/32 eq https count
    20 deny any any any log count
    30 permit tcp any eq 1024 203.0.113.20 eq 443
    40 permit icmp ip#9 any icmp-type echo
!
interface 1/1/1
    apply access-list ip EDGE in
!
interface vlan 20
    apply access-list ip EDGE routed-out
!
access-list ip CONTROL
    10 permit tcp 192.0.2.5/32 any eq ssh
    20 deny any any any log
!
apply access-list ip CONTROL control-plane vrf default
