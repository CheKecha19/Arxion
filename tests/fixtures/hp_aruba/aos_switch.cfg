; J0000A Configuration Editor; Created for synthetic parser tests only
hostname "synthetic-aos-switch"
ip authorized-managers 192.0.2.10 255.255.255.255 access manager access-method ssh
ip authorized-managers ip17 ip#18 access operator access-method snmp
ip access-list standard "ADMIN"
   10 permit host 192.0.2.20
   20 deny any log
   exit
ip access-list extended "WEB"
   10 permit tcp 198.51.100.0 0.0.0.255 host 203.0.113.10 eq 443
   20 deny ip any any log
   30 permit udp host ip#23 any eq domain
   40 permit tcp any any eq ssh established
   exit
access-list 101 permit tcp host 192.0.2.30 any eq 8443
vlan 20
   ip access-group "WEB" routed-in
   exit
vlan 30
   ip access-group "WEB" out
   exit
vlan 99
   ip access-group "ADMIN" in
   exit
interface 1
   ip access-group 101 out
   exit
