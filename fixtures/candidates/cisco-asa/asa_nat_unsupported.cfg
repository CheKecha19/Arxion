hostname ASA-NAT
!
object network PUBLIC_WEB
 host 203.0.113.10
object network INTERNAL_WEB
 host 192.0.2.30
!
access-list OUTSIDE_IN extended permit tcp any object INTERNAL_WEB eq 443 log
access-list OUTSIDE_IN extended deny ip any any log
access-group OUTSIDE_IN in interface outside
nat (inside,outside) source static INTERNAL_WEB PUBLIC_WEB service tcp https https
