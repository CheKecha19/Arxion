ASA Version 9.16(4)
hostname fictional-asa-fwd-06
!
interface GigabitEthernet0/0
 nameif inside
 security-level 100
 ip address 10.77.0.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 nameif outside
 security-level 0
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
object network SYNTH_INSIDE
 subnet 10.77.0.0 255.255.255.0
 nat (inside,outside) dynamic interface
!
object network SYNTH_REMOTE
 subnet 198.51.100.0 255.255.255.0
!
nat (inside,outside) source static SYNTH_INSIDE SYNTH_INSIDE destination static SYNTH_REMOTE SYNTH_REMOTE
!
access-list INSIDE_IN extended permit tcp host 10.77.0.10 host 198.51.100.20 eq 443
access-list GLOBAL_IN extended permit tcp host 10.77.0.10 host 198.51.100.20 eq 443
access-group INSIDE_IN in interface inside
access-group GLOBAL_IN global
