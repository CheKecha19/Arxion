ASA Version 9.16(4)
hostname fictional-asa-fwd-07
!
interface GigabitEthernet0/0
 nameif inside
 security-level 100
 ip address 10.77.0.1 255.255.255.0
 no shutdown
 policy-route route-map SYNTH_PBR
!
interface GigabitEthernet0/1
 nameif outside
 security-level 0
 ip address 192.0.2.1 255.255.255.0
 no shutdown
!
access-list PBR_CLASS extended deny tcp host 10.77.0.11 host 198.51.100.20 eq 443
access-list PBR_CLASS extended permit tcp host 10.77.0.10 host 198.51.100.20 eq 443
route-map SYNTH_PBR permit 10
 match ip address PBR_CLASS
 set ip next-hop 192.0.2.254
!
access-list INSIDE_IN extended permit tcp host 10.77.0.10 host 198.51.100.20 eq 443
access-list GLOBAL_IN extended permit tcp host 10.77.0.10 host 198.51.100.20 eq 443
access-group INSIDE_IN in interface inside
access-group GLOBAL_IN global
