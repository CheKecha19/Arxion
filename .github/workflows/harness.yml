name: Engineering Harness
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned uv
        run: python -m pip install uv==0.12.23
      - name: Install locked environments
        run: python harness/build setup
      - name: Run required gates
        run: python harness/build all
      - name: Retain logs even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-${{ matrix.os }}
          path: artifacts/harness/
          if-no-files-found: warn
